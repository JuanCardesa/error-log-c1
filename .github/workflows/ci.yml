name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test y cobertura
        run: pnpm test:coverage

      - name: Herramienta de Macmillan · logica pura
        run: pnpm macmillan:test

      - name: Herramienta de Macmillan · el userscript versionado esta al dia
        run: |
          pnpm macmillan:build
          git diff --exit-code tools/macmillan-capture/dist tools/macmillan-capture/extension || {
            echo '::error::El userscript o la extension no coinciden con sus fuentes. Ejecuta pnpm macmillan:build y versiona el resultado.'
            exit 1
          }

      - name: build
        run: pnpm build

      - name: Sin `any` ni `@ts-ignore` (DoD §8)
        run: |
          if grep -rnE '(: *any\b|<any>|as +any\b|@ts-ignore|@ts-nocheck)' src/ --include='*.ts' --include='*.tsx'; then
            echo '::error::DoD 8 prohibe any y @ts-ignore. Coincidencias arriba.'
            exit 1
          fi
          echo "Limpio."

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Flujos end-to-end
        run: pnpm test:e2e

      - name: Herramienta de Macmillan · captura en navegador
        run: pnpm macmillan:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
